; ===========================================================================
; fethr companion display - M5Stack AtomS3R on an Atomic ToChain Base
; ===========================================================================
;
; WHAT THIS BUILDS
;   The optional second screen for the fethr sidecar. It is NOT a Chain node:
;   it hangs off whichever HY2.0-4P port the DualKey's Chain bus did not claim
;   and speaks newline-delimited JSON over a plain UART (see ../../COMPANION.md
;   and ../../PROTOCOL.md). The DualKey firmware is the other half, in ../pio/.
;
; WHY THE COMMUNITY PLATFORM
;   Same reason as the DualKey project: the official `platformio/espressif32`
;   platform is pinned to arduino-esp32 2.0.x. M5Unified/M5GFX want a 3.x core,
;   and using the SAME platform zip for both projects means one toolchain
;   download and one set of versions to reason about.
;
; BOARD - why esp32-s3-devkitc-1 and not m5stack-atoms3
;   pioarduino ships `boards/m5stack-atoms3.json`, but that is the AtomS3, a
;   different part: ESP32-S3FN8, 8 MB flash, NO PSRAM. The AtomS3R is an
;   ESP32-S3-PICO-1-N8R8 - 8 MB flash plus 8 MB OCTAL PSRAM - and its board json
;   also carries `-DARDUINO_M5Stack_ATOMS3`, which is a claim about the hardware
;   that is not true here. M5Stack's own PlatformIO snippet on the AtomS3R
;   product page uses the generic devkit profile with the memory type corrected,
;   and that is what this file does. It is also what ../pio/platformio.ini does
;   for the DualKey, for the same reason.
;
;   M5Unified identifies the board at RUN time (it probes the display and the
;   I2C bus), so nothing here depends on the board json knowing what an AtomS3R
;   is. `?` over USB prints what it decided.
;
; MEMORY TYPE - the one line that must be right
;   board_build.arduino.memory_type = qio_opi
;     quad-SPI flash + OCTAL-SPI PSRAM. This is the physical wiring of the
;     N8R8 package; the DualKey's `qio_qspi` would be wrong here. Paired with
;     -DBOARD_HAS_PSRAM so the core initialises the PSRAM heap.
;   (M5Stack's snippet also passes -mfix-esp32-psram-cache-issue. That flag is
;   an ESP32-classic silicon workaround and does not apply to the S3, so it is
;   deliberately not carried over.)
;
; USB
;   The devkit board json hard-codes -DARDUINO_USB_MODE=1, and unlike the
;   DualKey that is what this project wants: the hardware USB-Serial-JTAG
;   peripheral. There is no HID here - the companion has no keys to send - so
;   TinyUSB buys nothing, and USB-Serial-JTAG survives a crash better because it
;   is not driven by application code. -DARDUINO_USB_CDC_ON_BOOT=1 makes
;   `Serial` that port, so the '?' console appears over the Atom's own cable.
;
; DOWNLOAD MODE (AtomS3R, per M5Stack's product page)
;   Press and HOLD the reset button (the side button, under the LCD button) for
;   about 2 seconds until the internal GREEN LED lights, then release. The LED
;   goes out and the board is in download mode. Unlike the DualKey there is no
;   cable dance - the Atom has a real reset button.
;
; BUILD / FLASH / MONITOR
;   pio run    -d hardware/firmware/companion-atoms3r
;   pio run    -d hardware/firmware/companion-atoms3r -t upload
;   pio device monitor
; ===========================================================================

[platformio]
; WINDOWS LONG-PATH WORKAROUND - see ../pio/platformio.ini for the full reason.
; Sharing the same core_dir as the DualKey project is deliberate: one download
; of the toolchain, one set of resolved versions across both firmwares.
core_dir = C:/pio

[env:companion_atoms3r]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board     = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3-PICO-1-N8R8: 8 MB flash, 8 MB octal PSRAM.
board_build.flash_size          = 8MB
board_upload.flash_size         = 8MB
board_build.partitions          = default_8MB.csv
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

; src/ only, so M5Unified/M5GFX keep their own (noisier) warning settings while
; this project's code is held to -Wall -Wextra clean. Same policy as ../pio/.
build_src_flags =
    -Wall
    -Wextra

; M5Unified pulls M5GFX in as a dependency; both come from M5Stack and are
; version-locked to each other, so only M5Unified is named here.
; ArduinoJson is pinned to the v7 API for the same reason as the DualKey
; project: v7 removed StaticJsonDocument and `JsonDocument` is the only
; document type. Deserialisation only - every outbound line is snprintf'd into
; one static buffer.
lib_deps =
    m5stack/M5Unified@^0.2.7
    bblanchon/ArduinoJson@^7.4

monitor_speed   = 115200
upload_protocol = esptool

; Uncomment once you know which port the Atom takes:
; upload_port   = COM8
; monitor_port  = COM8

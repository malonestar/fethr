[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fethr"
version = "0.3.0"
description = "Local-first dictation for Windows. Hold a key, speak, release — the text lands at your cursor."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kyle Maloney" }]
keywords = ["dictation", "speech-to-text", "whisper", "local-first", "windows", "macropad"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "keyboard>=0.13.5",
    "pyperclip>=1.8",
    "pystray>=0.19",
    "Pillow>=10.0",
    "requests>=2.31",
    "pywebview>=5.0",
    "pyserial>=3.5",
    "pycaw>=20240210",
    "comtypes>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fethr = "fethr.__main__:main"

[project.urls]
Homepage = "https://github.com/malonestar/fethr"
Issues = "https://github.com/malonestar/fethr/issues"

[tool.setuptools.packages.find]
include = ["fethr*"]

[tool.setuptools.package-data]
fethr = ["ui/web/*", "ui/web/img/*", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

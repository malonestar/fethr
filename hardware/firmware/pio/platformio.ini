; ===========================================================================
; Flow Sidecar v2 - M5Stack Chain DualKey (ESP32-S3FN8) macro-keyboard
; ===========================================================================
;
; WHY THE COMMUNITY PLATFORM:
;   M5Chain (and the Chain DualKey board support generally) needs arduino-esp32
;   core 3.x. The official `platformio/espressif32` platform is still pinned to
;   arduino-esp32 2.0.x and will NOT build this project. `pioarduino` is the
;   community fork that ships the 3.x cores, so it is used here.
;
; BOARD:
;   There is no `m5stack-chain-dualkey` board json in pioarduino (the whole
;   boards/ listing was checked - only the older m5stack-* boards are present),
;   so the generic ESP32-S3 devkit profile is used and the three things that
;   actually differ are pinned explicitly below:
;     - ESP32-S3FN8  => 8 MB quad SPI flash, NO PSRAM  (memory_type qio_qspi)
;     - native USB   => TinyUSB OTG so HID + CDC coexist (see build_flags)
;   Everything else about the DualKey (pins, LEDs, Chain UART) lives in
;   include/config.h, not in the board definition.
;
; USB FLAGS (arduino-esp32 3.x, libraries/USB + cores/esp32/USB.cpp):
;   ARDUINO_USB_MODE=0        -> USB-OTG / TinyUSB stack (required for HID).
;                                ARDUINO_USB_MODE=1 would select the hardware
;                                USB-Serial-JTAG peripheral, which cannot do HID.
;   ARDUINO_USB_CDC_ON_BOOT=1 -> `Serial` is the TinyUSB CDC port, so the FLOG
;                                debug output and the `?` console appear on the
;                                same USB cable as the HID device.
;   These replace the Arduino IDE's "USB Mode" / "USB CDC On Boot" Tools menu -
;   under PlatformIO the menu does not exist and these flags are the setting.
;
; DOWNLOAD-MODE DANCE (required before EVERY `pio run -t upload`):
;   The DualKey has no reset button, and once this HID sketch owns the port the
;   usual auto-reset-into-bootloader handshake does not exist.
;     1. Move the 3-position side switch to the MIDDLE position.
;     2. Unplug USB-C.
;     3. Hold Key1 (the button farther from the lanyard hole).
;     4. Plug USB-C back in while still holding Key1.
;     5. Release Key1 - the board is now in download mode and a new COM port
;        appears. Set `upload_port` below (or let PlatformIO autodetect) and
;        run `pio run -t upload`.
;   To reboot into the flashed sketch instead: switch middle, unplug, replug
;   WITHOUT holding Key1.
;
; BUILD / FLASH / MONITOR:
;   pio run
;   pio run -t upload
;   pio device monitor
; ===========================================================================

[platformio]
; WINDOWS LONG-PATH WORKAROUND - do not remove without reading this.
;   pioarduino's `esp32-arduino-libs` package contains paths ~200 characters
;   long (the bundled esp-matter / connectedhomeip headers). Unpacking them
;   under the default core_dir `C:\Users\<you>\.platformio\...` blows past the
;   260-character Win32 MAX_PATH and the install aborts with
;   `WindowsLongPathError`. On this machine
;   HKLM\SYSTEM\CurrentControlSet\Control\FileSystem\LongPathsEnabled = 0.
;   Two ways out; this file takes the second because it needs no admin rights
;   and touches no system settings:
;     (a) set LongPathsEnabled = 1 (admin, reboot) - then you can delete this
;         block and PlatformIO will use its normal per-user core_dir;
;     (b) move the whole PlatformIO core dir somewhere short.  <- used here
;   C:\pio holds only downloaded toolchains/frameworks/libraries (~1.5 GB of
;   cache); deleting it just forces a re-download.
core_dir = C:/pio

[env:chain_dualkey]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board     = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3FN8: 8 MB flash, no PSRAM.
board_build.flash_size            = 8MB
board_upload.flash_size           = 8MB
board_build.partitions            = default_8MB.csv
board_build.arduino.memory_type   = qio_qspi

; The esp32-s3-devkitc-1 board json hard-codes -DARDUINO_USB_MODE=1 (hardware
; USB-Serial-JTAG). It has to be removed, not just overridden, or every
; translation unit compiles with a "ARDUINO_USB_MODE redefined" warning and the
; effective value depends on flag ordering.
build_unflags =
    -DARDUINO_USB_MODE=1

build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1

; Applies to src/ ONLY, so the framework and the two libraries keep their own
; (noisier) warning settings while our code is held to -Wall -Wextra clean.
build_src_flags =
    -Wall
    -Wextra

; Pinned: the API surface in include/ was verified against exactly these.
;
; ArduinoJson: v2.1's host settings protocol (PROTOCOL.md) parses inbound
; commands with it. The owner/name were checked against the registry API
; (https://api.registry.platformio.org/v3/packages/bblanchon/library/ArduinoJson)
; - `bblanchon/ArduinoJson`, latest 7.4.3, so ^7.4 pins the v7 API. v7 matters:
; StaticJsonDocument is gone and the elastic `JsonDocument` is the only
; document type. Only DESERIALISATION uses it, and only while a host command
; is in hand; every reply and event is built with snprintf into one static
; buffer, so the idle loop allocates nothing.
;
; `Preferences` (the NVS store behind settings.cpp) needs no entry here - it
; ships with the arduino-esp32 core.
lib_deps =
    m5stack/M5Chain@^1.0.10
    adafruit/Adafruit NeoPixel@^1.15.2
    bblanchon/ArduinoJson@^7.4

monitor_speed   = 115200
upload_protocol = esptool

; Uncomment and set once you know which port the download-mode board takes:
; upload_port   = COM7
; monitor_port  = COM7
